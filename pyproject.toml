[project]
name = "worldascode"
version = "0.1.0"
description = "Evidence-driven procedural world reconstruction and versioned kit workflows"
readme = "README.md"
authors = [
    { email = "truongpmn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2", "pydantic>=2,<3", "pillow>=11", "numpy>=2", "playwright>=1.50", "psutil>=7"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.17", "build>=1"]

[project.scripts]
worldascode = "worldascode.cli.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldascode*"]
namespaces = true

[tool.setuptools.package-data]
worldascode = ["resources/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
