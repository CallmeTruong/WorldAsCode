[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "worldscale-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2", "pydantic>=2,<3", "pillow>=11", "numpy>=2", "playwright>=1.50", "psutil>=7"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.17"]

[project.scripts]
worldscale = "worldscale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
